<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block titulo %}Fichas T20{% endblock %}</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Alegreya:wght@500;700&family=Alegreya+Sans:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <header class="topo">
    <a href="{{ url_for('index') }}">Fichas T20</a>
    {% if usuario %}<nav>
      {% if usuario and usuario.papel == 'mestre' %}
        <a href="{{ url_for('dashboard_mestre') }}">Painel de danos</a>
        <a href="{{ url_for('exportar_excel_mestre') }}">Baixar Excel</a>
      {% endif %}
      <span>{{ usuario.nome }}{{ " (mestre)" if usuario.papel == "mestre" }}</span>
      <form method="post" action="{{ url_for('sair') }}"><input type="hidden" name="csrf" value="{{ csrf_token() }}"><button class="link">Sair</button></form>
    </nav>{% endif %}
  </header>
  <main class="{% block classe %}{% endblock %}">{% block conteudo %}{% endblock %}</main>
{% block scripts %}{% endblock %}
</body>
</html>
